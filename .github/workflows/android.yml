name: Android CI

on:
  push:
    branches: [ "main", "dev" ]
  tags:
    - "v*"
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.SIGNING_KEY }}
        run: |
          echo $ENCODED_STRING | base64 -di > app/cloudphone.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          if [[ "${{ github.event.inputs.build_type }}" == "debug" ]]; then
            ./gradlew assembleScrcpyDebug
          else
            ./gradlew assembleScrcpyRelease
          fi
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Debug APK
        if: github.event.inputs.build_type == 'debug' || github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: CloudPhone-debug-apk
          path: |
            app/build/outputs/apk/scrcpy/debug/*.apk
          retention-days: 7

      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: CloudPhone-release-apk
          path: |
            app/build/outputs/apk/scrcpy/release/*.apk
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: app/build/outputs/apk/scrcpy/release/*.apk